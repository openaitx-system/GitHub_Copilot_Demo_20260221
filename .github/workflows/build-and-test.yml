name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Check test coverage
        run: |
          # Parse coverage report and check threshold (>80% required)
          COVERAGE=$(find ./coverage -name "coverage.cobertura.xml" -exec grep -oP 'line-rate="\K[^"]+' {} \; | head -1)
          if [ -n "$COVERAGE" ]; then
            PERCENT=$(echo "$COVERAGE * 100" | bc)
            echo "## Test Coverage: ${PERCENT}%" >> $GITHUB_STEP_SUMMARY
            echo "Code coverage: ${PERCENT}%"
            if (( $(echo "$COVERAGE < 0.80" | bc -l) )); then
              echo "::error::Code coverage ${PERCENT}% is below the 80% threshold"
              exit 1
            else
              echo "::notice::Code coverage ${PERCENT}% meets the 80% threshold"
            fi
          else
            echo "::warning::Could not parse coverage report"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./coverage/**/coverage.cobertura.xml
          retention-days: 14
